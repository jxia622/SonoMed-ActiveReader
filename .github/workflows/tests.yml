name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      OMP_NUM_THREADS: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev,viz]'
      - name: Run synthetic source tests
        run: python -m pytest -q
      - name: Exercise demo and rebuild public figures
        run: |
          python scripts/demo_acquisition.py
          python scripts/plot_public_results.py
          python scripts/active_reader.py --config configs/active_reader.yaml smoke-test-environment --output artifacts/replay-smoke.json
